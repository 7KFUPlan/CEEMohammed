st water but drains very slowly.","a":true,"c":""},{"ch":4,"s":"Density is the weight per unit volume.","a":false,"c":"Density = **mass** per unit volume; unit weight = weight per unit volume."},{"ch":4,"s":"Porosity is the ability of a rock to let water flow through it.","a":false,"c":"That is **permeability**; porosity = ratio of voids to total volume."},{"ch":4,"s":"Permeability depends on connected pores.","a":true,"c":""},{"ch":4,"s":"Strength is the resistance of a material to failure under applied load.","a":true,"c":""},{"ch":4,"s":"Schmidt hammer and sonic velocity are destructive tests.","a":false,"c":"They are **non-destructive**."},{"ch":4,"s":"Atterberg limits evaluate the consistency and plasticity of fine-grained soils.","a":true,"c":""},{"ch":5,"s":"A fold forms when rock layers break and slide.","a":false,"c":"Rock layers **bend** without breaking (breaking & sliding = fault)."},{"ch":5,"s":"Folding happens deep underground where rocks are soft and flexible due to heat and pressure.","a":true,"c":""},{"ch":5,"s":"When rocks fold, the Earth’s crust becomes longer and thinner.","a":false,"c":"It becomes **shorter and thicker**."},{"ch":5,"s":"The hinge is the point of maximum curvature of a fold.","a":true,"c":""},{"ch":5,"s":"The hinge line marks where the axial plane intersects the surface of the Earth.","a":true,"c":""},{"ch":5,"s":"The plunge is the plane that divides the fold symmetrically.","a":false,"c":"That is the **axial plane**; plunge is the **angle** the fold axis slopes downward."},{"ch":5,"s":"The limbs are the sides of the fold.","a":true,"c":""},{"ch":5,"s":"A fault is a crack in the Earth where rocks have moved.","a":true,"c":""},{"ch":5,"s":"A joint is a crack in the rock where movement has occurred.","a":false,"c":"A joint has **no movement**."},{"ch":5,"s":"The hanging wall is the block below the fault plane.","a":false,"c":"It is **above**; the footwall is below."},{"ch":5,"s":"In a normal fault the hanging wall moves down relati let tab=ls.get("cee-geo2-tab")||"D",ch=0;if(!G[tab])tab="D";
const save=()=>ls.set("cee-geo2",JSON.stringify(st));
function score(){const keys=Object.keys(st).filter(k=>k[0]===tab),ok=keys.filter(k=>st[k][1]).length;$("#score").textContent=`${ok} / ${G[tab].length}`}
function render(){
  const list=$("#list");list.textContent="";let cur=0;
  G[tab].forEach((q,i)=>{
    if(ch&&q.ch!==ch)return;
    if(q.ch!==cur){cur=q.ch;const h=document.createElement("div");h.className="sec";h.textContent=`Chapter ${cur} · ${CH[cur]}`;list.append(h)}
    const id=tab+i,c=document.createElement("div");c.className="card";
    if(tab==="D")c.innerHTML=`<p class="lbl">وش المصطلح؟</p><div class="qh"><span class="n">${q.n}</span><div class="qt">${esc(q.def)}</div></div><div class="opts">${q.o.map((o,k)=>`<button class="o" data-k="${k}"><b>${L[k]})</b><span>${esc(o)}</span></button>`).join("")}</div>`;
    else if(tab==="M")c.innerHTML=`<div class="qh"><span class="n">${i+1}</span><div><div class="qt">${esc(q.q)}</div><p class="ar">${esc(q.ar)}</p></div></div><div class="opts">${q.o.map((o,k)=>`<button class="o" data-k="${k}"><b>${L[k]})</b><span>${esc(o)}</span></button>`).join("")}</div>`;
    else c.innerHTML=`<div class="qh"><span class="n">${i+1}</span><div class="qt">${esc(q.s)}</div></div><div class="tf"><button class="o" data-k="1">True</button><button class="o" data-k="0">False</button></div>`;
    const ans=tab==="T"?(q.a?1:0):q.a;
    const show=(pick)=>{c.classList.add("done",pick===ans?"ok":"no");c.querySelectorAll(".o").forEach(b=>{const k=+b.dataset.k;if(k===ans)b.classList.add("good");else if(k===pick)b.classList.add("wrong")});
      if(tab==="T"&&!c.querySelector(".fix")){const f=document.createElement("div");f.className="fix"+(q.a?" t":"");f.innerHTML=q.a?"✔ True":"✘ False — "+rich(q.c);c.append(f)}};
    c.querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(c.classList.contains("done"))return;const p=+b.dataset.k;st[id]=[p,p===ans];save();show(p);score()});
    if(st[id])show(st[id][0]);
    list.append(c)});
  score();
}
function bars(){
  document.querySelectorAll("#tabs .chip").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.t===tab);b.onclick=()=>{tab=b.dataset.t;ls.set("cee-geo2-tab",tab);bars();render();window.scrollTo(0,0)}});
  const c=$("#chs");c.textContent="";[0,1,2,3,4,5].forEach(k=>{const b=document.createElement("button");b.className="chip";b.textContent=k?"Ch "+k:"الكل";b.setAttribute("aria-pressed",k===ch);b.onclick=()=>{ch=k;bars();render()};c.append(b)});
}
$("#reset").onclick=()=>{if(!confirm("تمسح إجاباتك في هالقسم وتبدأ من جديد؟"))return;Object.keys(st).forEach(k=>{if(k[0]===tab)delete st[k]});save();render()};
bars();render();
})();
</script>
</body>
</html>
