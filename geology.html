<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- multiple choice ---------- */
const MCQ=[
 {q:"Molten rock that reaches the surface is called:",o:["Lava.","Magma.","Igneous.","Sediment."],a:0,
  why:"الصخر المنصهر له اسمين حسب مكانه: **تحت الأرض** اسمه **ماجما (Magma)**، ولما يطلع على **سطح الأرض** يصير اسمه **لافا (Lava)**. السؤال قال \"reaches the surface\" فالجواب لافا.",
  en:"Molten rock below the surface = magma; once it erupts onto the surface = lava."},
 {q:"Granite is classified as:",o:["Mafic.","Felsic.","Clastic.","Metamorphic."],a:1,
  why:"الجرانيت غني بالسيليكا (حوالي 70%) ومعادنه فاتحة (كوارتز وفلسبار)، وهذا تعريف **فلسي (Felsic)** = Feldspar + Silica. أما **مافي (Mafic)** فهو الغني بالمغنيسيوم والحديد مثل البازلت. وClastic نوع رسوبي، وMetamorphic متحول، والجرانيت ناري.",
  en:"Granite is rich in silica (~70%) and light minerals (quartz, K-feldspar) → felsic."},
 {q:"Intrusive igneous rocks are characterized by:",o:["Fast cooling and small crystals.","Slow cooling and large crystals.","Fast cooling and large crystals.","Slow cooling and no crystals."],a:1,
  why:"الصخور **الداخلية (Intrusive)** تبرد **تحت الأرض**، والحرارة حولها عالية فتبرد **ببطء**. والتبريد البطيء يعطي البلورات وقت تكبر، فتطلع **بلورات كبيرة** (نسيج خشن) مثل الجرانيت. عكسها الخارجية (Extrusive): تبرد بسرعة على السطح فتطلع بلوراتها صغيرة.",
  en:"Intrusive rocks cool slowly underground, so crystals have time to grow large (coarse-grained)."},
 {q:"The most important agent of metamorphism is:",o:["Water.","Gravity.","Heat.","Wind."],a:2,
  why:"عوامل التحول: **الحرارة** والضغط والسوائل النشطة كيميائيًا. وأهمها **الحرارة**، لأنها توفر الطاقة اللي تخلي المعادن تعيد ترتيب نفسها وتتبلور من جديد. الجاذبية والرياح عوامل تعرية مو تحول.",
  en:"Heat is the most important agent: it provides the energy that drives recrystallization and new minerals."},
 {q:"Permeability is:",o:["The volume of voids in materials.","The ability of rock to resist weathering.","How much material changes under load.","How easily water flows through materials."],a:3,
  why:"**النفاذية (Permeability)** = قدرة المادة إنها **تسمح للماء يمر** خلالها، يعني مدى اتصال الفراغات ببعض. لا تخلطها مع **المسامية (Porosity)**: هذي حجم الفراغات نفسها، وهي الخيار (a).",
  en:"Permeability = how easily a fluid flows through a material. Porosity (option a) = the volume of voids."},
 {q:"The type of stress that pulls a rock apart and lengthens it is:",o:["Compressional.","Tensional.","Confining.","Shear."],a:1,
  why:"**الإجهاد الشدّي (Tensional)** يسحب الصخر من الطرفين فـ**يطوّله** ويرققه ويفصله. **الانضغاطي (Compressional)** عكسه: يضغط ويقصّر. **القصّي (Shear)** يحرك الأجزاء جنب بعض. **المحصور (Confining)** ضغط متساوي من كل الجهات.",
  en:"Tensional stress pulls rock apart and lengthens it; compressional shortens it; shear slides it."},
 {q:"When a rock passes its elastic limit and bends without breaking, it is:",o:["Elastic.","Ductile.","Brittle.","Differential."],a:1,
  why:"لما الصخر يتجاوز **حد المرونة** فيه احتمالين: ينكسر (**هش، Brittle**) أو ينثني ويتشوه بدون كسر (**لدن، Ductile**). السؤال قال \"bends without breaking\" فهو **Ductile**. أما **Elastic** فيرجع لشكله الأصلي، وهذا قبل حد المرونة.",
  en:"Past the elastic limit: bending without breaking = ductile; breaking = brittle."},
 {q:"When a mineral breaks along flat surfaces and straight lines, it is called:",o:["Fracture.","Streak.","Luster.","Cleavage."],a:3,
  why:"**الانفصام (Cleavage)** = المعدن ينكسر على **أسطح مستوية** بسبب ضعف الروابط في اتجاهات معينة. **المكسر (Fracture)** عكسه: كسر غير منتظم أو محاري مثل الكوارتز. وStreak وLuster خصائص ثانية: لون المسحوق واللمعان.",
  en:"Cleavage = breaking along smooth flat planes of weak bonds. Fracture = irregular breaking."},
 {q:"In an anticline:",o:["The fold is downward, youngest rock in center.","The fold is upward, oldest rock in center.","The fold is upward, youngest rock in center.","The fold is downward, oldest rock in center."],a:1,
  why:"**الطية المحدبة (Anticline)** مقوسة **لفوق** مثل حرف ∩، ولما تتعرى يطلع في **وسطها الصخر الأقدم**. عكسها **المقعرة (Syncline)**: لتحت مثل ∪، والأحدث في وسطها. طريقة للحفظ: **A**nticline = **A** شكلها لفوق.",
  en:"Anticline = upward (arch) fold with the oldest rocks in the core; syncline = downward with the youngest in the core."},
 {q:"Which of the following is an example of an extrusive rock?",o:["Granite.","Basalt.","Gabbro.","Shale."],a:1,
  why:"**البازلت** صخر ناري **خارجي (Extrusive)**: يبرد بسرعة على السطح، فبلوراته دقيقة. الجرانيت والجابرو **داخليين** (بلورات كبيرة)، والجابرو هو \"توأم\" البازلت الداخلي. والشيل (Shale) صخر رسوبي.",
  en:"Basalt is extrusive (fine-grained). Granite and gabbro are intrusive; shale is sedimentary."},
 {q:"The rock surface located above a dipping fault is called:",o:["Foot wall.","Slickenside.","Hanging wall.","Limb."],a:2,
  why:"في الصدع المائل فيه جدارين: اللي **فوق** سطح الصدع اسمه **الجدار المعلّق (Hanging wall)** كأنه معلّق فوقك، واللي **تحت** اسمه **جدار القدم (Foot wall)** لأنك تقدر توقف عليه. والـSlickenside خدوش على سطح الصدع، والـLimb جناح الطية.",
  en:"Above the fault plane = hanging wall; below it = footwall."},
 {q:"Which of the following is NOT one of the spheres of the Earth?",o:["Hydrosphere.","Atmosphere.","Lithosphere.","Biosphere."],a:2,
  why:"الكتاب (Tarbuck) يقسم الأرض لأربعة أغلفة: **Hydrosphere** (الماء)، **Atmosphere** (الهواء)، **Biosphere** (الحياة)، و**Geosphere** (الأرض الصلبة). فالـ**Lithosphere** مو واحد من الأربعة، هو طبقة **داخل** الـGeosphere (القشرة + أعلى الوشاح). عشان كذا الجواب المقصود غالبًا **(c)**.",
  en:"The four spheres: hydrosphere, atmosphere, biosphere and geosphere. The lithosphere is a layer within the geosphere.",
  note:"⚠️ **تنبيه:** هالسؤال فيه خلل. بعض المراجع تسمي الأرض الصلبة **Lithosphere** بدل Geosphere، وعلى هالأساس كل الخيارات صحيحة. الجواب المقصود حسب الكتاب هو (c). تأكد من الدكتور."},
 {q:"Coal is classified as:",o:["Clastic.","Organic.","Chemical.","Bioclastic."],a:1,
  why:"**الفحم** يتكون من **بقايا نباتات** تتراكم وتنضغط مع الوقت، فهو صخر رسوبي **عضوي (Organic)**. **Clastic** يتكون من فتات صخور (مثل الحجر الرملي)، و**Chemical** يترسب من محلول (مثل الملح الصخري)، و**Bioclastic** من أصداف وهياكل كائنات (مثل بعض الحجر الجيري).",
  en:"Coal forms from compressed plant remains → organic sedimentary rock."},
 {q:"The force that is applied unequally is called:",o:["Confining pressure.","Differential stress.","Tensional stress.","Strain."],a:1,
  why:"**الإجهاد التفاضلي (Differential stress)** = قوة **غير متساوية** في الاتجاهات، وهو اللي يشوّه الصخر ويغير شكله. عكسه **الضغط المحصور (Confining pressure)**: متساوي من كل الجهات ويغير الحجم بس. و**Strain** هو التشوه الناتج، مو القوة نفسها.",
  en:"Differential stress = stress applied unequally in different directions. Confining pressure is equal in all directions."},
 {q:"Which scale is used as the standard for measuring mineral hardness?",o:["Richter scale.","Mohs scale.","Beaufort scale.","pH scale."],a:1,
  why:"**مقياس موس (Mohs)** يرتب المعادن من 1 (التلك، الأنعم) إلى 10 (الألماس، الأقسى) حسب مين يخدش مين. **Richter** للزلازل، و**Beaufort** لسرعة الرياح، و**pH** للحموضة.",
  en:"Mohs hardness scale: 1 (talc) to 10 (diamond), based on scratch resistance."}
];

/* ---------- text helpers for written answers ---------- */
function norm(s){return String(s).toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()}
const has=(t,list)=>list.some(w=>{const n=norm(w);return /[a-z]/.test(n)?new RegExp("(^|[^a-z])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(t):t.includes(n)});

/* Q16: definitions graded by key ideas (approximate) */
const DEFS=[
 {k:"a",term:"Weathering",need:3,ideas:[
   {d:"تكسّر / تفتت / تحلل",w:["break","broken","breakdown","disintegrat","decompos","crumbl","تكسر","تكسير","تفتت","تفتيت","تحلل","تفكك","تكسير","يتكسر","يتفتت","يتحلل"]},
   {d:"الصخور (أو المعادن)",w:["rock","mineral","صخر","صخور","معادن","معدن"]},
   {d:"على سطح الأرض أو قريب منه",w:["surface","near the surface","سطح","السطح"]},
   {d:"فيزيائيًا أو كيميائيًا (بدون ما ينتقل)",w:["physical","mechanical","chemical","in place","without transport","فيزيائي","ميكانيكي","كيميائي","مكانه","دون نقل","بدون نقل"]}],
  model:"Weathering is the physical breakdown (disintegration) and chemical alteration (decomposition) of rocks at or near the Earth's surface, without moving them.",

function matchItem(text,table){const t=norm(text);if(!t)return -1;
  const order=table.map((r,i)=>i).sort((a,b)=>Math.max(...table[b][1].map(w=>norm(w).length))-Math.max(...table[a][1].map(w=>norm(w).length)));
  for(const i of order)if(has(t,table[i][1]))return i;return -1}

    <div style="margin-top:8px">${rich("**الفكرة كلها من السيليكا:** الجرانيتي فيه **سيليكا كثير** (~70%)، فمعادنه **فاتحة** (كوارتز وفلسبار بوتاسي)، وهو **أخف** وزنًا، ويتبلور على **حرارة أقل**، وماجمته **لزجة** (ثقيلة). ويكوّن **القشرة القارية**. والبازلتي عكسه: **سيليكا قليل** (~50%) و**حديد ومغنيسيوم كثير**، فمعادنه **غامقة** (بيروكسين وبلاجيوكليز كلسي وأوليفين)، وهو **أثقل**، ويتبلور على **حرارة أعلى**، وماجمته **سايلة**. ويكوّن **القشرة المحيطية**.")}</div>
    <div style="margin-top:6px">${rich("**ملاحظة للاختبار:** لو السؤال مقالي اكتب 4 أو 5 فروق من هالجدول، وابدأ بالتركيب (Felsic/Mafic) والسيليكا لأنهم السبب في باقي الفروق.")}</div></div>`,"written");
  c.querySelector('[data-a="check"]').onclick=()=>{let good=0,tot=0;
    c.querySelectorAll("table select").forEach(s=>{tot++;s.classList.remove("good","wrong");if(s.value==="")return;const ok=+s.value===+s.dataset.c;s.classList.add(ok?"good":"wrong");if(ok)good++});
    const r=c.querySelector(".res");r.hidden=false;r.className="res "+(good===tot?"good":good?"part":"bad");r.textContent=good===tot?"✔ كلها صح":`صح ${good} من ${tot}`;mark(20,good===tot)};
  c.querySelector('[data-a="why"]').onclick=()=>{const w=c.querySelector(".why");w.hidden=!w.hidden};W.append(c)})();

document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));
