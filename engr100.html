<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engr 100 — Midterm Drill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#f4f6f9;--sheet:#fff;--ink:#14223a;--muted:#5b6778;--line:#d9e0ea;--blue:#16407a;--blue2:#1f6fc5;--tint:#e8f1fb;--ok:#137a43;--ok-t:#e4f6ec;--bad:#b42318;--bad-t:#fdecea;--sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0d1522;--sheet:#141f31;--ink:#e6ecf5;--muted:#9aa8bd;--line:#26354d;--blue:#8db8f0;--blue2:#5b9be6;--tint:#18294a;--ok:#5fd394;--ok-t:#12301f;--bad:#ff8a80;--bad-t:#3a1714;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0d1522;--sheet:#141f31;--ink:#e6ecf5;--muted:#9aa8bd;--line:#26354d;--blue:#8db8f0;--blue2:#5b9be6;--tint:#18294a;--ok:#5fd394;--ok-t:#12301f;--bad:#ff8a80;--bad-t:#3a1714;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7}
.hd{background:linear-gradient(135deg,#16407a,#1f6fc5);color:#fff;padding:22px 16px 18px;padding-top:max(22px,env(safe-area-inset-top))}
.hd .in{max-width:760px;margin:auto}.hd a{color:#cfe3ff;font-size:13px;text-decoration:none}
.hd h1{margin:6px 0 2px;font-size:24px}.hd p{margin:0;font-size:13px;opacity:.9}
.bar{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sc{font-weight:700;font-size:14px}.sc b{color:var(--blue2)}
.pg{flex:1;min-width:80px;height:7px;background:var(--line);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
button{font:600 13px var(--sans);border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:9px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--blue2)}button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:760px;margin:auto;padding:14px 16px 60px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.qh{display:flex;gap:10px;align-items:flex-start;direction:ltr}
.n{background:var(--blue);color:#fff;border-radius:8px;min-width:30px;text-align:center;font-weight:700;padding:1px 0;font-size:14px}
.qh p{margin:0;font-weight:600;font-size:15.5px;line-height:1.55}
.os{display:grid;gap:7px;margin:10px 0 0;direction:ltr}
.o{display:flex;gap:9px;text-align:left;width:100%;padding:9px 11px;border-radius:10px;font-weight:500;font-size:14.5px;line-height:1.45}
.o b{color:var(--muted);min-width:16px}
.o.ok{background:var(--ok-t);border-color:var(--ok);color:var(--ink)}.o.ok b{color:var(--ok)}
.o.bad{background:var(--bad-t);border-color:var(--bad)}.o.bad b{color:var(--bad)}
.q.done .o{cursor:default}
.ex{display:none;margin-top:10px;background:var(--tint);border-radius:10px;padding:9px 12px;font-size:14px;border-inline-start:4px solid var(--blue2)}
.q.done .ex,.all .ex{display:block}.ex b{color:var(--blue)}
.all .o.right{background:var(--ok-t);border-color:var(--ok)}
.fin{display:none;text-align:center;background:var(--sheet);border:2px solid var(--ok);border-radius:14px;padding:18px;font-weight:700;font-size:18px}
</style></head><body>
<div class="hd"><div class="in"><a href="./">← الرئيسية</a><h1>Engr 100 — مدخل إلى الهندسة</h1><p>Midterm 2025 · أسئلة مؤكدة مع شرح الإجابة · اضغط الخيار وشوف الشرح</p></div></div>
<div class="bar"><div class="in"><span class="sc">النتيجة <b id="s">0</b> / <span id="t"></span></span><div class="pg"><i id="p"></i></div>
<button id="sh">أظهر كل الإجابات</button><button id="rs">إعادة</button><button id="th">🌓</button></div></div>
<main id="m"></main>
<script>
const D=[{"n": 1, "q": "Which of the following attributes is NOT suitable for a successful Engineer?", "o": ["Team leader", "Decision maker", "Lifelong learner", "Work in a toxic environment"], "a": 3, "e": "المهندس الناجح يقود فريق (A) ويتخذ قرارات (B) ويتعلّم طول عمره (C). أما <b>بيئة العمل السامة</b> فهي شي سلبي لازم يتجنبه، مو صفة مناسبة له."}, {"n": 2, "q": "When the functions of Engineers and Scientists are compared, which of the following statements is correct?", "o": ["Engineers apply mathematical and natural sciences to design and develop usable devices, structures and processes.", "Engineers use mathematical and natural sciences to acquire new knowledge.", "Scientists apply mathematical and natural sciences to design and develop usable devices, structures, and processes.", "Both Science and Engineering are not professions."], "a": 0, "e": "المهندس <b>يطبّق</b> الرياضيات والعلوم الطبيعية عشان <b>يصمم ويطوّر</b> أجهزة وإنشاءات وعمليات. العالِم هو اللي يستخدمها عشان يكتشف معرفة جديدة (B و C معكوسين). و D غلط لأن الاثنين مهنتين."}, {"n": 3, "q": "________ involves the application of chemistry, physics, and engineering to the design and operation of plants for the production of materials that undergo chemical changes during their manufacture.", "o": ["Civil Engineering", "Electrical Engineering", "Chemical Engineering", "Mechanical Engineering"], "a": 2, "e": "المصانع اللي تتحول فيها المواد كيميائياً = <b>الهندسة الكيميائية</b>. المدنية للإنشاءات، الكهربائية للطاقة والإلكترونيات، الميكانيكية للآلات والحركة."}, {"n": 4, "q": "Which of the following statements is Wrong?", "o": ["Engineers can work in construction, operations, or production.", "Engineers can work in sales and management.", "Engineers can work for themselves.", "Engineers cannot work for military."], "a": 3, "e": "السؤال يطلب العبارة <b>الغلط</b>. المهندس يشتغل في الإنشاء والتشغيل والإنتاج (A)، والمبيعات والإدارة (B)، ولنفسه (C)، وكمان <b>يقدر يشتغل في الجيش</b>، فالعبارة D هي الغلط."}, {"n": 5, "q": "Ethics is the study of which of the following?", "o": ["Humane behavior", "Moral choices and actions", "Natural science", "Mental health"], "a": 1, "e": "الـ Ethics = <b>الأخلاقيات</b>: دراسة الخيارات والتصرفات الأخلاقية (الصح والغلط في السلوك). الباقي مو تعريفها."}, {"n": 6, "q": "Holding paramount the safety, health and welfare of the public and striving to comply with principles of sustainable development in performing their professional duties is an example of:", "o": ["Code of Ethics for Engineers", "Code of Honor Engineers", "Code of Conduct for Engineers", "Code of Sustainability for Engineers"], "a": 0, "e": "هذا نص من <b>Code of Ethics</b> للمهندسين، وأهم مبدأ فيه: سلامة وصحة ورفاهية الناس. الخيارات الثانية أسماء مشابهة بس مو الاسم الرسمي."}, {"n": 7, "q": "If an engineer realizes a mistake was made after completing a project, what is the ethical course of action?", "o": ["Hide the mistake", "Ignore the mistake", "Attempt to correct the mistake", "All of the above"], "a": 2, "e": "التصرف الأخلاقي أنك <b>تصلح الخطأ</b>. الإخفاء (A) والتجاهل (B) غير أخلاقيين، فـ D مستحيلة."}, {"n": 8, "q": "Engineers must provide protection to the public:", "o": ["Health", "Welfare", "Safety", "All the above"], "a": 3, "e": "التزام المهندس تجاه الناس: حماية <b>الصحة</b> (Health) و<b>السلامة</b> (Safety) و<b>الرفاهية</b> (Welfare)، كلها مع بعض، فالجواب All the above."}, {"n": 9, "q": "Which criteria provide fundamental guidance to compare design options and make objective choices?", "o": ["Most criteria, shall criteria and ecological criteria", "Must criteria, should criteria and preference criteria", "Most criteria, industrial criteria and engineering criteria", "Must criteria, science criteria and engineering criteria"], "a": 1, "e": "معايير المقارنة بين التصاميم ثلاثة: <b>Must</b> (إلزامية) و<b>Should</b> (مفضّلة) و<b>Preference</b> (تفضيلات). باقي الخيارات فيها مسميات مو موجودة."}, {"n": 10, "q": "Engineering design does not require:", "o": ["Creative thinking", "Analysis", "Communication", "Ignoring safety"], "a": 3, "e": "التصميم الهندسي يحتاج تفكير إبداعي (A) وتحليل (B) وتواصل (C). أما <b>تجاهل السلامة</b> فمستحيل يكون جزء منه، فهو اللي \"does not require\"."}, {"n": 11, "q": "The first step in the scientific method is:", "o": ["Asking a question", "Optimization", "Construct a hypothesis", "Conceptualization"], "a": 0, "e": "المنهج العلمي يبدأ بـ<b>سؤال</b> (ملاحظة أو مشكلة)، وبعده الفرضية (C). Optimization و Conceptualization من خطوات التصميم مو المنهج العلمي."}, {"n": 12, "q": "To facilitate the solution of engineering problems, engineers use models such as:", "o": ["Mathematical model", "Physical models", "Simulation models", "All the above"], "a": 3, "e": "النماذج الهندسية: <b>رياضي</b> (معادلات) و<b>فيزيائي</b> (مجسّم) و<b>محاكاة</b> (برنامج)، كلها تُستخدم، فالجواب All the above."}, {"n": 15, "q": "Successful engineers must be able to communicate effectively with:", "o": ["Their supervisors, colleagues, investors, and public because they are all stakeholders", "Their supervisors and colleagues because they are the only stakeholders", "Their working colleagues and investors because they are the only stakeholders", "The organization's management because they are the only stakeholders"], "a": 0, "e": "المهندس لازم يتواصل مع <b>كل</b> أصحاب المصلحة: المشرفين والزملاء والمستثمرين والجمهور. كلمة <b>only</b> في B و C و D تخليها غلط."}, {"n": 17, "q": "Mastery oriented students are students who:", "o": ["Seek to earn good grades to reflect how hard they've worked", "Try to do things well because they want to do their best", "Seek to be famous and rich", "Try to do things in very short time"], "a": 1, "e": "طالب الـ <b>mastery</b> يهتم بـ<b>إتقان</b> الشي نفسه وإنه يقدم أحسن ما عنده. A و C يهتمون بالدرجات والشهرة، و D بالسرعة."}, {"n": 18, "q": "VARK is a system used to profile your learning preference (or learning style). Which of the following is NOT a learning style of VARK?", "o": ["Visual", "Auditory", "Kinesthetic", "Reading and speaking"], "a": 3, "e": "الـ <b>VARK</b> = Visual, Auditory, <b>Read/Write</b>, Kinesthetic. عبارة \"Reading and speaking\" مو منها."}, {"n": 19, "q": "The services provided by engineers require:", "o": ["Honesty", "Fairness", "Impartiality", "All the above"], "a": 3, "e": "خدمات المهندس تحتاج <b>أمانة</b> و<b>عدل</b> و<b>حياد</b> كلها مع بعض، فالجواب All the above."}, {"n": 20, "q": "What is a Team?", "o": ["A group of people working on different things", "A group of people attending an event", "A group of people working together for a common purpose", "A group of people where one member makes all the decisions"], "a": 2, "e": "الفريق (Team) = ناس يشتغلون <b>مع بعض لهدف مشترك</b>. A ما يجمعهم هدف، B مجرد حضور، D قرار فرد واحد وهذا مو فريق."}, {"n": 21, "q": "Which of the following is an example of a simulation model in engineering design?", "o": ["A physical scale model of a bridge", "A computer program that predicts the behavior of a complex system", "A hand-drawn sketch of a product", "A checklist of design features"], "a": 1, "e": "الـ <b>Simulation</b> = برنامج كمبيوتر يحاكي سلوك نظام معقّد. A مجسّم فيزيائي، C رسمة يدوية، D قائمة تحقق."}, {"n": 23, "q": "Engineers, in the fulfillment of their professional duties, shall not ________.", "o": ["Accept deceptive acts", "Hold paramount the safety, health, and welfare of the public", "Issue public statements only in an objective and truthful manner", "Act for each employer or client as faithful agents or trustees"], "a": 0, "e": "السؤال يقول <b>shall not</b>: المهندس ممنوع <b>يقبل الخداع</b>. الباقي واجبات لازم يلتزم فيها."}, {"n": 24, "q": "Which of the following is NOT part of the ethical decision-making process?", "o": ["Identify issues and stakeholders", "Convergence of Perspectives", "Analyze options from different perspectives", "Formulating a hypothesis"], "a": 3, "e": "خطوات القرار الأخلاقي: تحديد المشكلة وأصحاب المصلحة، تحليل الخيارات من وجهات نظر مختلفة، وتقارب وجهات النظر. <b>الفرضية</b> من المنهج العلمي مو من القرار الأخلاقي."}, {"n": 25, "q": "Which action is unacceptable for engineers when fulfilling their professional duties?", "o": ["Engineers shall not give credit for engineering work to those to whom credit is due.", "Engineers shall at all times strive to serve the public interest.", "Engineers shall not disclose, without consent, confidential information concerning the business affairs or technical processes of any present or former client or employer, or public body on which they serve.", "Engineers shall not be influenced in their professional duties by conflicting interests."], "a": 0, "e": "العبارة A تقول المهندس <b>ما يعطي</b> الفضل لأصحابه، وهذا تصرف مرفوض (لازم يعطي الفضل لأهله). B و C و D التزامات أخلاقية سليمة."}, {"n": 27, "q": "Which of the following is not considered a technique used to assist in generating original ideas?", "o": ["Brainstorming", "Attribute listing", "Checklists", "Financial reporting"], "a": 3, "e": "العصف الذهني (A) وقائمة الخصائص (B) وقوائم التحقق (C) تقنيات لتوليد الأفكار. <b>التقارير المالية</b> محاسبة، مو توليد أفكار."}, {"n": 28, "q": "\"............\" design new instruments, devices, and software, assemble knowledge from many scientific sources to develop new procedures, and conduct research to solve medical issues.", "o": ["Biochemical Engineers", "Mechanical Engineers", "Software Engineers", "Biomedical Engineers"], "a": 3, "e": "<b>Biomedical</b> يجمع الهندسة والطب: يصمم أجهزة وبرمجيات طبية ويحل مشاكل طبية. Biochemical للعمليات الحيوية الكيميائية، والباقي مجالات ثانية."}, {"n": 29, "q": "What makes a bad engineer?", "o": ["Problem solvers", "Work in a team environment", "Inflexible and intolerant", "Have written and oral communication skills"], "a": 2, "e": "الجمود وعدم التسامح (<b>Inflexible and intolerant</b>) صفة مهندس سيئ. الباقي صفات المهندس الجيد."}, {"n": 30, "q": "Which of the following statements accurately describe plagiarism?", "o": ["Academic dishonesty", "Not giving credit for other people contributions", "Illegal", "All of the above"], "a": 3, "e": "الانتحال = خيانة أكاديمية، وعدم إعطاء الفضل لأصحابه، وغير قانوني. كلها صحيحة، فالجواب <b>All of the above</b>."}];
const m=document.getElementById('m');let sc=0,ans=0;document.getElementById('t').textContent=D.length;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){sc=0;ans=0;m.classList.remove('all');document.getElementById('sh').classList.remove('on');
m.innerHTML=D.map((q,i)=>`<section class="q" data-i="${i}"><div class="qh"><span class="n">${q.n}</span><p>${esc(q.q)}</p></div><div class="os">${q.o.map((t,j)=>`<button class="o ${j==q.a?'right':''}" data-j="${j}"><b>${'ABCD'[j]}</b><span>${esc(t)}</span></button>`).join('')}</div><div class="ex">💡 ${q.e}</div></section>`).join('')+'<div class="fin" id="f"></div>';upd()}
function upd(){document.getElementById('s').textContent=sc;document.getElementById('p').style.width=ans/D.length*100+'%';
 const f=document.getElementById('f');if(ans==D.length){f.style.display='block';f.textContent='خلصت! نتيجتك '+sc+' من '+D.length+(sc==D.length?' 🔥':'')}else if(f)f.style.display='none'}
m.addEventListener('click',e=>{const b=e.target.closest('.o');if(!b)return;const q=b.closest('.q');if(q.classList.contains('done'))return;
 const d=D[+q.dataset.i],j=+b.dataset.j;q.classList.add('done');ans++;
 q.querySelectorAll('.o').forEach(x=>{if(+x.dataset.j==d.a)x.classList.add('ok')});if(j==d.a)sc++;else b.classList.add('bad');upd()});
document.getElementById('rs').onclick=render;
document.getElementById('sh').onclick=function(){const on=m.classList.toggle('all');this.classList.toggle('on',on);
 m.querySelectorAll('.q').forEach(q=>{q.querySelectorAll('.o').forEach(x=>x.classList.toggle('ok',on&&+x.dataset.j==D[+q.dataset.i].a))})};
document.getElementById('th').onclick=()=>{const r=document.documentElement;const dk=getComputedStyle(r).colorScheme==='dark'||r.dataset.theme==='dark';r.dataset.theme=dk?'light':'dark'};
render();
</script></body></html>
