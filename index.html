<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEEMohammed</title>
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="description" content="CEEMohammed — تدريب مواد الهندسة المدنية: ستاتيك و GPS الكنتور.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bar:#111111; --bar-ink:#ffffff; --bar-soft:#b5b0a6; --gold:#E5A82E;
  --panel:#ffffff; --ink:#14223a; --muted:#5b6778; --line:#d9e0ea; --hover:#eef3fa; --on:#16407a;
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --h:56px;
}
@media (prefers-color-scheme: dark){
  :root{--panel:#141c28;--ink:#e6ecf4;--muted:#97a3b4;--line:#2a3646;--hover:#1d2838;--on:#8fbaf0}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bar)}
body{font-family:var(--sans);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.bar{flex:none;height:var(--h);border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px;padding-inline:12px 16px;background:var(--bar);color:var(--bar-ink);position:relative;z-index:20}
.menu-btn{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:inherit;display:grid;place-items:center;cursor:pointer}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{background:rgba(255,255,255,.16)}
.menu-btn svg{width:22px;height:22px}
.brand{color:inherit;text-decoration:none;font:600 18px/1 var(--mono);letter-spacing:.02em;direction:ltr}
.current{margin-inline-start:auto;color:var(--bar-soft);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;top:calc(var(--h) + 2px);inset-inline-start:12px;width:min(300px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.28);z-index:30}
.menu h2{margin:10px 10px 6px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.menu a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:inherit;text-decoration:none}
.menu a:hover{background:var(--hover)}
.menu a[aria-current="page"]{background:var(--hover);color:var(--on)}
.menu .num{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font:600 14px var(--mono)}
.menu a[aria-current="page"] .num{border-color:currentColor}
.menu b{display:block;font-size:16px;font-weight:600}
.menu small{display:block;font-size:13px;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:10}
main{flex:1;min-height:0;background:#fff}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>

<header class="bar">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#home">CEEMohammed</a>
  <span class="current" id="current"></span>
  <nav class="menu" id="menu" hidden>
    <a href="#home" data-page="home"><span class="num"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></span><span><b>الرئيسية</b><small>CEEMohammed</small></span></a>
    <h2>اختر المادة</h2>
    <a href="#statics" data-page="statics"><span class="num">1</span><span><b>ستاتيك</b><small>Statics — تدريب الميد</small></span></a>
    <a href="#contour" data-page="contour"><span class="num">2</span><span><b>GPS الكنتور</b><small>CEE 272 — خطوط الكنتور</small></span></a>
    <h2>أدوات</h2>
    <a href="#notes" data-page="notes"><span class="num"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.4L16.4 4.4a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/></svg></span><span><b>النوت</b><small>دفتر تكتب فيه بالقلم وتحفظه</small></span></a>
    <a href="#calc" data-page="calc"><span class="num"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M8.5 11.5h1M12 11.5h1M15.5 11.5h0M8.5 15h1M12 15h1M15.5 15v2"/></svg></span><span><b>الحاسبة</b><small>علمية: معادلات، مصفوفات، متجهات</small></span></a>
  </nav>
</header>
<div class="scrim" id="scrim" hidden></div>

<main><iframe id="view" title="المادة"></iframe></main>

<script>
(function(){
  var V="10";
  var PAGES={home:{src:"home.html",name:"الرئيسية"},statics:{src:"statics.html",name:"ستاتيك"},contour:{src:"contour.html",name:"GPS الكنتور"},notes:{src:"notes.html",name:"النوت"},calc:{src:"calc.html",name:"الحاسبة"}};
  var btn=document.getElementById("menuBtn"),menu=document.getElementById("menu"),scrim=document.getElementById("scrim"),
      view=document.getElementById("view"),cur=document.getElementById("current"),links=menu.querySelectorAll("a");
  function setOpen(o){menu.hidden=!o;scrim.hidden=!o;btn.setAttribute("aria-expanded",o)}
  function show(){
    var key=location.hash.slice(1);
    if(!PAGES[key])key="home";
    var p=PAGES[key];
    var src=p.src+"?v="+V;
    if(view.getAttribute("src")!==src)view.setAttribute("src",src);
    cur.textContent=p.name;
    document.title=key==="home"?"CEEMohammed":p.name+" — CEEMohammed";
    links.forEach(function(a){if(a.dataset.page===key)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
    setOpen(false);
  }
  btn.addEventListener("click",function(){setOpen(menu.hidden)});
  scrim.addEventListener("click",function(){setOpen(false)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")setOpen(false)});
  links.forEach(function(a){a.addEventListener("click",function(){setOpen(false)})});
  window.addEventListener("hashchange",show);
  show();
})();
</script>
</body>
</html>
